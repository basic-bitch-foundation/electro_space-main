kind = "web"
previewPath = "/"
title = "Electrospace Hardware Store"
version = "1.0.0"
id = "artifacts/electrospace"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18282

[services.development]
run = "pnpm --filter @workspace/electrospace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/electrospace", "run", "build" ]
publicDir = "artifacts/electrospace/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18282"
BASE_PATH = "/"
